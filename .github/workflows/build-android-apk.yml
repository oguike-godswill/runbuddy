name: Build RunBuddy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build RunBuddy Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./run_buddy
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./run_buddy
        run: flutter build apk --release

      - name: Rename APK for easy download
        working-directory: ./run_buddy
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RunBuddy-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunBuddy-Android-APK
          path: run_buddy/build/app/outputs/flutter-apk/RunBuddy-Android.apk
          retention-days: 30

      - name: Publish Direct Download APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "RunBuddy Android APK (Latest Build)"
          body: "Direct installable Android APK for RunBuddy."
          files: run_buddy/build/app/outputs/flutter-apk/RunBuddy-Android.apk
          prerelease: false
          make_latest: true
