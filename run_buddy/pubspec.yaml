name: run_buddy
description: "Run Buddy - Remote social running companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  geolocator: ^13.0.1
  web_socket_channel: ^3.0.0
  http: ^1.2.1
  livekit_client: ^2.2.3
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
